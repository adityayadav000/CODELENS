apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codelens-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codelens-api
  minReplicas: 2    # Normal days: minimum 2 pods
  maxReplicas: 10   # Traffic spikes: maximum 10 pods
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale up when average CPU crosses 70%!