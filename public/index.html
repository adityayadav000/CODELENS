<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes the page scale on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeLens</title>

  <!-- CSS = how things look (colors, spacing). Not required for logic. -->
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 8px; }
    .sub { color: #555; margin-bottom: 24px; }
    textarea { width: 100%; height: 90px; padding: 10px; font-size: 14px; }
    button { margin-top: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 12px; color: #555; }
    #answer { margin-top: 24px; white-space: pre-wrap; background: #f6f6f6; padding: 12px; border-radius: 8px; }
    .citation { border: 1px solid #ddd; border-radius: 8px; padding: 10px; margin-top: 10px; }
    .path { font-weight: 600; }
    .preview { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; margin-top: 6px; }
  </style>
</head>

<body>
  <!-- What the user sees -->
  <h1>CodeLens</h1>
  <p class="sub">Ask a question about the indexed codebase. Answers include file/line citations.</p>
    <h2 style="font-size: 1.1rem; margin-top: 24px;">Index a GitHub repo</h2>
  <input
    id="repoUrl"
    type="text"
    placeholder="https://github.com/owner/repo"
    style="width: 100%; padding: 10px; font-size: 14px; box-sizing: border-box;"
  />
  <button id="indexBtn" type="button">Index repo</button>
  <div id="indexStatus" style="margin-top: 8px; color: #555;"></div>

  <hr style="margin: 28px 0; border: none; border-top: 1px solid #ddd;" />

  <h2 style="font-size: 1.1rem;">Ask a question</h2>
  <!-- id= lets JavaScript find this element later -->
  <textarea id="question" placeholder="e.g. how does this library escape regex special characters?"></textarea>
  <br />
  <button id="askBtn">Ask</button>

  <!-- Empty boxes we fill after the API responds -->
  <div id="status"></div>
  <div id="answer"></div>
  <div id="citations"></div>

  <script>
    // ===== 1. Grab the HTML elements by id =====
    const questionEl = document.getElementById('question'); //The getElementById() method of the Document interface returns an Element object representing the element whose id property matches the specified string
    const askBtn = document.getElementById('askBtn');
    const statusEl = document.getElementById('status');
    const answerEl = document.getElementById('answer');
    const citationsEl = document.getElementById('citations');
    const repoUrlEl = document.getElementById('repoUrl');
    const indexBtn = document.getElementById('indexBtn');
    const indexStatusEl = document.getElementById('indexStatus');
    // ===== 2. When user clicks Ask, run this function =====
    askBtn.addEventListener('click', async () => {
      // Read the text from the textarea
      const question = questionEl.value.trim();

      // Don't call the API with an empty question
      if (!question) {
        statusEl.textContent = 'Type a question first.';
        return;
      }

      // Disable button so user doesn't click 10 times while waiting
      askBtn.disabled = true;
      statusEl.textContent = 'Searching...';
      answerEl.textContent = '';
      citationsEl.innerHTML = ''; // clear old citation cards

      try {
        // ===== 3. Call YOUR backend API =====
        // fetch = browser's way to send HTTP requests
        // POST /ask with JSON body { "question": "..." }
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });

        // Turn response body into a JS object
        const data = await res.json();

        // If server returned an error (400/500)
               if (!res.ok) {
          statusEl.textContent = data.error || 'Request failed';
          return;
        }

        statusEl.textContent = 'Done';
        answerEl.textContent = data.answer;

        // Debug: open browser console (F12) and check this
        console.log('API critic field:', data.critic);

        let criticBox = document.getElementById('critic');
        if (!criticBox) {
          criticBox = document.createElement('div');
          criticBox.id = 'critic';
          criticBox.style.marginTop = '16px';
          criticBox.style.padding = '12px';
          criticBox.style.borderRadius = '8px';
          criticBox.style.border = '1px solid #ccc';
          answerEl.insertAdjacentElement('afterend', criticBox);
        }

               if (data.critic) {
          const ok = Boolean(data.critic.pass);
          const attempts = data.attempts || 1;
          const attemptLabel = attempts > 1 
            ? ` (Self-corrected on attempt ${attempts}! ⚡)` 
            : ` (Verified on attempt 1)`;

          criticBox.style.background = ok ? '#e8f5e9' : '#ffebee';
          criticBox.style.borderColor = ok ? '#81c784' : '#e57373';
          criticBox.innerHTML = `
            <strong>Critic: ${ok ? 'PASS' : 'FAIL'}${ok ? attemptLabel : ''}</strong>
            <p style="margin: 4px 0 0 0; font-size: 13px; color: #444;">${data.critic.notes || ''}</p>
          `;
        } else {
          criticBox.innerText = 'Critic: (not in API response)';
        }

        citationsEl.innerHTML = '';
        for (const c of data.citations || []) {
          const div = document.createElement('div');
          div.className = 'citation';
          div.innerHTML =
            `<div class="path">${c.path} (lines ${c.start_line}-${c.end_line})</div>` +
            `<div>meaning: ${Number(c.meaning_score).toFixed(3)} | keyword: ${Number(c.keyword_score).toFixed(3)}</div>` +
            `<div class="preview">${c.preview || ''}</div>`;
          citationsEl.appendChild(div);
        }
      } catch (err) {
        // Network error (server not running, wrong URL, etc.)
        statusEl.textContent = 'Could not reach the API. Is the server running?';
      } finally {
        // Always re-enable the button
        askBtn.disabled = false;
      }
    });
     indexBtn.addEventListener('click', async () => {
      const url = repoUrlEl.value.trim();
      if (!url) {
        indexStatusEl.textContent = 'Paste a GitHub URL first.';
        return;
      }

      indexBtn.disabled = true;
      indexStatusEl.innerHTML = `
        <div style="margin-top: 10px;">
          <div style="background: #e0e0e0; border-radius: 6px; overflow: hidden; height: 16px; width: 100%;">
            <div id="progressBar" style="background: #1976d2; height: 100%; width: 5%; transition: width 0.3s ease;"></div>
          </div>
          <div id="progressText" style="margin-top: 6px; font-size: 13px; color: #444;">Queueing job in Redis...</div>
        </div>
      `;

      try {
        // Step 1: Submit job to Express queue producer
        const res = await fetch('/index', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          indexStatusEl.textContent = data.error || 'Failed to queue index job';
          indexBtn.disabled = false;
          return;
        }

        const jobId = data.jobId;
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        // Step 2: Poll /index/status/:jobId every 800ms
        const interval = setInterval(async () => {
          try {
            const statusRes = await fetch(`/index/status/${jobId}`);
            const statusData = await statusRes.json();

            if (statusData.state === 'failed') {
              clearInterval(interval);
              progressText.textContent = `❌ Indexing failed: ${statusData.failedReason || 'Unknown error'}`;
              progressBar.style.background = '#d32f2f';
              indexBtn.disabled = false;
              return;
            }

            if (statusData.progress) {
              const pct = statusData.progress.percent || 10;
              progressBar.style.width = pct + '%';
              progressText.textContent = `[${pct}%] ${statusData.progress.message || 'Processing...'}`;
            }

            if (statusData.state === 'completed') {
              clearInterval(interval);
              progressBar.style.width = '100%';
              progressBar.style.background = '#388e3c';
              progressText.textContent = `✅ Done! Indexed ${statusData.result?.filesIndexed || 0} files (${statusData.result?.chunksIndexed || 0} chunks). Ready for questions!`;
              indexBtn.disabled = false;
            }
          } catch (pollErr) {
            console.error('Polling error:', pollErr);
          }
        }, 800);

      } catch (err) {
        indexStatusEl.textContent = 'Could not reach API. Is server running?';
        indexBtn.disabled = false;
      }
    });
 </script>
</body>
</html>
